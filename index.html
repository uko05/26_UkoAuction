<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="うーこの部屋の各サイトで出品されたアイテムを横断的に一覧・入札できるオークションサイトです。">

    <title>うーこオークション - うーこの部屋</title>
    <link rel="stylesheet" href="style.css?v=1">

    <!-- Favicon -->
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="16x16" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/favicon-16x16.png">
    <link rel="icon" sizes="32x32" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/apple-touch-icon.png">
    <link rel="icon" sizes="192x192" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/android-chrome-192x192.png">
    <link rel="icon" sizes="512x512" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/android-chrome-512x512.png">
</head>
<body>
    <header>
        <div class="header-topbar">
            <div class="lang-switch">
                <label><input type="radio" name="lang" value="ja" checked> JP</label>
                <label><input type="radio" name="lang" value="en"> EN</label>
            </div>
        </div>
        <h1 data-i18n="pageTitle">うーこオークション</h1>
        <p class="header-sub" data-i18n="headerSub">うーこの部屋の各サイトで出品されたアイテムを一覧・入札できます</p>
    </header>

    <main>
        <div id="campaign-banner" class="campaign-banner" hidden></div>
        <div class="auction-sort-row">
          <span id="auction-listing-count" class="auction-listing-count"></span>
          <span class="auction-sort-row-right">
          <label for="auction-sort-select" class="auction-sort-label" data-i18n="sortLabel">並べ替え</label>
          <select id="auction-sort-select" class="auction-sort-select">
            <option value="endingSoon" data-i18n="sortEndingSoon">残り時間が短い順</option>
            <option value="newest" data-i18n="sortNewest">新着順</option>
            <option value="priceLow" data-i18n="sortPriceLow">価格が安い順</option>
            <option value="priceHigh" data-i18n="sortPriceHigh">価格が高い順</option>
            <option value="bidCount" data-i18n="sortBidCount">入札件数が多い順</option>
          </select>
          </span>
        </div>
        <div id="auction-list" class="auction-list"></div>
    </main>

    <div class="toast" id="toast" style="display:none;"></div>

    <!-- 入札ポップ -->
    <div id="auction-bid-modal" class="col-modal" style="display:none;">
      <div class="col-modal-backdrop"></div>
      <div class="col-modal-content">
        <button id="auction-bid-close" class="col-modal-close" aria-label="close">×</button>
        <p class="bid-modal-title" id="auction-bid-name"></p>
        <p class="bid-modal-prompt" id="auction-bid-prompt"></p>
        <input type="number" id="auction-bid-input" class="auction-bid-input" step="1">
        <button type="button" id="auction-bid-submit" class="auction-bid-submit-btn" style="margin-top:14px;">入札する</button>
      </div>
    </div>

    <!-- サムネイル拡大表示 -->
    <div id="auction-lightbox" class="auction-lightbox">
      <img id="auction-lightbox-img" src="" alt="">
    </div>

    <!-- 自分の入札一覧ポップ -->
    <div id="auction-mybids-modal" class="col-modal" style="display:none;">
      <div class="col-modal-backdrop"></div>
      <div class="col-modal-content auction-mybids-content">
        <button id="auction-mybids-close" class="col-modal-close" aria-label="close">×</button>
        <p class="bid-modal-title" data-i18n="myBidsBtn">自分の入札</p>
        <div id="auction-mybids-list" class="auction-mybids-list"></div>
      </div>
    </div>

    <!-- キャンペーン管理(管理者ロールのみ、JSでhiddenを外す) -->
    <div id="auction-campaign-modal" class="col-modal" style="display:none;">
      <div class="col-modal-backdrop"></div>
      <div class="col-modal-content auction-campaign-content">
        <button id="auction-campaign-close" class="col-modal-close" aria-label="close">×</button>
        <p class="bid-modal-title" data-i18n="campaignAdminTitle">キャンペーン管理</p>

        <div id="campaign-admin-list" class="campaign-admin-list"></div>

        <p class="campaign-form-title" data-i18n="campaignNewTitle">新しいキャンペーンを作成</p>
        <div class="campaign-form">
          <label class="campaign-form-row">
            <span data-i18n="campaignTypeLabel">種類</span>
            <select id="campaign-new-type">
              <option value="sellerBonus" data-i18n="campaignTypeSellerBonus">出品者ボーナス(落札額×倍率)</option>
              <option value="listingBonus" data-i18n="campaignTypeListingBonus">出品即時ボーナス(定額)</option>
              <option value="listingCountBonus" data-i18n="campaignTypeListingCountBonus">出品数ボーナス(段階制)</option>
            </select>
          </label>
          <label class="campaign-form-row">
            <span data-i18n="campaignLabelLabel">名前(管理用メモ)</span>
            <input type="text" id="campaign-new-label" maxlength="40">
          </label>
          <label class="campaign-form-row">
            <span data-i18n="campaignStartsLabel">開始日時</span>
            <input type="datetime-local" id="campaign-new-starts">
          </label>
          <label class="campaign-form-row">
            <span data-i18n="campaignDaysLabel">開催日数</span>
            <input type="number" id="campaign-new-days" min="1" step="1" value="7">
          </label>

          <label id="campaign-field-sellerBonus" class="campaign-form-row">
            <span data-i18n="campaignMultiplierLabel">倍率(例: 1.5)</span>
            <input type="number" id="campaign-new-multiplier" min="1" step="0.1" value="1.5">
          </label>

          <label id="campaign-field-listingBonus" class="campaign-form-row" hidden>
            <span data-i18n="campaignBonusAmountLabel">出品時にもらえるUP</span>
            <input type="number" id="campaign-new-bonusAmount" min="1" step="1" value="10">
          </label>

          <div id="campaign-field-listingCountBonus" class="campaign-form-row" hidden>
            <span data-i18n="campaignTiersLabel">段階設定(出品数としてもらえるUP)</span>
            <div class="campaign-tier-row">
              <input type="number" id="campaign-tier-count-1" min="1" step="1" placeholder="3">
              <span>件 →</span>
              <input type="number" id="campaign-tier-bonus-1" min="1" step="1" placeholder="30">
              <span>UP</span>
            </div>
            <div class="campaign-tier-row">
              <input type="number" id="campaign-tier-count-2" min="1" step="1" placeholder="5">
              <span>件 →</span>
              <input type="number" id="campaign-tier-bonus-2" min="1" step="1" placeholder="60">
              <span>UP</span>
            </div>
            <div class="campaign-tier-row">
              <input type="number" id="campaign-tier-count-3" min="1" step="1" placeholder="10">
              <span>件 →</span>
              <input type="number" id="campaign-tier-bonus-3" min="1" step="1" placeholder="150">
              <span>UP</span>
            </div>
            <div class="campaign-tier-row">
              <input type="number" id="campaign-tier-count-4" min="1" step="1">
              <span>件 →</span>
              <input type="number" id="campaign-tier-bonus-4" min="1" step="1">
              <span>UP</span>
            </div>
            <div class="campaign-tier-row">
              <input type="number" id="campaign-tier-count-5" min="1" step="1">
              <span>件 →</span>
              <input type="number" id="campaign-tier-bonus-5" min="1" step="1">
              <span>UP</span>
            </div>
          </div>

          <button type="button" id="campaign-new-create-btn" class="auction-bid-submit-btn" data-i18n="campaignCreateBtn">作成する</button>
          <p class="campaign-form-msg" id="campaign-new-msg"></p>
        </div>
      </div>
    </div>

    <!-- 固定フッター: 自分の入札(バッジは「更新されました」件数)・キャンペーン管理(管理者のみ) -->
    <div class="auction-fixed-footer">
      <button type="button" id="auction-campaign-btn" class="auction-mybids-fab" hidden>
        <span class="auction-mybids-fab-icon-wrap">
          <span class="auction-mybids-fab-icon">🎯</span>
        </span>
        <span data-i18n="campaignAdminBtn">キャンペーン管理</span>
      </button>
      <button type="button" id="auction-mybids-btn" class="auction-mybids-fab">
        <span class="auction-mybids-fab-icon-wrap">
          <span class="auction-mybids-fab-icon">📋</span>
          <span id="auction-mybids-badge" class="footer-badge" style="display:none;">0</span>
        </span>
        <span data-i18n="myBidsBtn">自分の入札</span>
      </button>
    </div>

    <footer class="site-footer">
        <a href="https://x.com/uko_dayo_" target="_blank" rel="noopener">
            <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/footer_icon/twitter_image.png" alt="Twitter" class="twitter-icon">
        </a>
        <a href="https://t.co/0jAcAV2GJv" target="_blank" rel="noopener">
            <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/footer_icon/discord_image.png" alt="Discord" class="twitter-icon">
        </a>
        <span class="sad_label">＜友達ください…</span>
        <span id="uko-account-status-slot"></span>
    </footer>

    <span id="site-version" class="site-version">v1.0</span>

    <script type="module" src="script.js"></script>
    <script src="https://uko05.github.io/TopPage00/shared/sidebar.js"></script>
    <script type="module" src="https://uko05.github.io/24_AccountCenter/account-status.js"></script>
</body>
</html>
